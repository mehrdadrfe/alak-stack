# ----------------------------
# Global settings
# ----------------------------
global
  log stdout format raw local0
  maxconn 4096
  tune.bufsize 131072
  tune.maxrewrite 8192

# ----------------------------
# Defaults
# ----------------------------
defaults
  log global
  mode http
  option httplog
  option http-keep-alive
  option http-buffer-request
  option redispatch
  option forwardfor
  retries 2

  timeout http-request    30s
  timeout connect         5s
  timeout client          6m
  timeout server          6m
  timeout http-keep-alive 30s
  timeout tunnel          1h

  # Extended log format (client, frontend, backend, timings, status, headers)
  log-format  "%ci:%cp [%t] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Tt %ST %B %tsc %ac/%fc/%bc/%sc/%rc %sq %bq {%HM %HV} {%hr} {%hs}"

# ----------------------------
# Frontend (edge listener)
# ----------------------------
frontend fe_main
  bind :80
  bind :443 ssl crt /etc/haproxy/ssl/

  # Preserve proto + host headers for Gatekeeper
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  http-request set-header X-Forwarded-Proto http  if !{ ssl_fc }
  http-request set-header X-Forwarded-Host %[req.hdr(Host)]

  default_backend be_gatekeeper

# ----------------------------
# Backend: Alak Gatekeeper
# ----------------------------
backend be_gatekeeper
  balance roundrobin

  # Health check: Gatekeeper exposes /healthz
  option httpchk GET /healthz
  http-check expect rstatus (2|3)..   # pass 2xx or 3xx

  http-reuse always                   # connection reuse toward Gatekeeper
  default-server inter 2s rise 2 fall 3 maxconn 500

  server gatekeeper alak-gatekeeper.alak.svc.cluster.local:8090 check

# ----------------------------
# (Optional) Stats interface
# ----------------------------
listen stats
  bind :8404
  mode http
  stats enable
  stats uri /stats
  stats refresh 10s
  stats show-node
  stats auth admin:admin   # change me!
